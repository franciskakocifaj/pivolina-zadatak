<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivolina · Zagrebačko craft pivo</title>
<meta name="description" content="Pivolina – fiktivni zagrebački craft brend. Prototip početne stranice za EY Studio+ dizajnerski zadatak.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%238F2F06'%3E%3Crect width='8' height='8'/%3E%3Crect x='16' width='8' height='8'/%3E%3Crect x='8' y='8' width='8' height='8'/%3E%3Crect y='16' width='8' height='8'/%3E%3Crect x='16' y='16' width='8' height='8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oi&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:0.8}
.pv-strip{background-image:url(assets/etikete-traka.jpg);background-repeat:no-repeat}
.pv-map{-webkit-mask:url(assets/hrvatska.svg) center/contain no-repeat;mask:url(assets/hrvatska.svg) center/contain no-repeat}
.pv-fade{transition:background-color .6s ease,color .6s ease,border-color .6s ease,box-shadow .6s ease}
@keyframes pv-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pv-marq{animation:pv-marq 28s linear infinite}
@media (prefers-reduced-motion: reduce){.pv-marq{animation:none}}
.pv-burger,.pv-mnav{display:none}
@media (max-width: 760px){.pv-age-h{font-size:40px !important}}
@media (max-width: 1100px){
.pv-fans-h{font-size:min(72px, calc((100vw - 96px) / 13.5)) !important}
.pv-nav{gap:28px !important;font-size:18px !important}
.pv-spin-grid{gap:32px !important}
.pv-can{transform:translate(-50%,-50%) rotate(45deg) scale(0.62) !important}
.pv-can-ring{width:400px !important;height:400px !important}
.pv-taste{font-size:36px !important}
}
@media (max-width: 760px){
.pv-wrap{padding-left:16px !important;padding-right:16px !important}
.pv-hd{padding:10px 16px !important;flex-wrap:nowrap !important;gap:10px !important}
.pv-nav{display:none !important}
.pv-burger{display:inline-flex}
.pv-mnav{display:flex}
.pv-logo-word{font-size:20px !important}
.pv-hide-sm{display:none}
.pv-kupi{padding:12px 18px !important;font-size:15px !important}
.pv-cart{width:46px !important;height:46px !important}
.pv-hero{padding-top:24px !important;padding-bottom:24px !important}
.pv-hero-svg{height:120px !important}
.pv-sticky{top:68px !important;height:calc(100vh - 68px) !important;min-height:720px}
.pv-spin-grid{display:flex !important;flex-direction:column;padding:16px 16px 216px !important;gap:12px !important}
.pv-copy{display:contents !important}
.pv-can-col{order:2;flex:1 1 auto;min-height:250px}
.pv-spin-grid .pv-cta{order:3;align-self:center !important;margin-top:8px}
.pv-taste{font-size:24px !important}
.pv-dl{font-size:14px !important;gap:4px 14px !important}
.pv-cta{font-size:15px !important;padding:13px 20px !important}
.pv-can{transform:translate(-50%,-50%) rotate(45deg) scale(0.36) !important}
.pv-can-ring{width:210px !important;height:210px !important}
.pv-marq-wrap{bottom:20px !important;height:60px !important}
.pv-marq li{font-size:14px !important;padding:9px 16px !important}
.pv-tagline{font-size:17px !important;left:16px !important;right:16px !important;bottom:132px !important}
.pv-sec{padding-top:56px !important;padding-bottom:40px !important;gap:36px !important}
.pv-h-svg{height:64px !important}
.pv-story{font-size:17px !important}
.pv-story-lead{font-size:24px !important}
.pv-trio{grid-template-columns:minmax(0,1fr) !important;gap:48px !important}
.pv-trio img{height:280px !important}
.pv-fans-h{font-size:calc((100vw - 32px) / 13.5) !important;max-width:100%;overflow-wrap:anywhere}
.pv-fans{grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-template-rows:none !important;grid-auto-rows:170px}
.pv-fans figure{grid-column:auto !important;grid-row:auto !important}
.pv-fans figure:first-child{grid-column:1 / span 2 !important}
.pv-lok-h{padding-top:56px !important}
.pv-lok-svg{height:84px !important}
.pv-foot-nav{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.pv-foot{padding-top:48px !important;gap:36px !important}
}
</style>
<style>html{scroll-behavior:smooth}#app:empty{min-height:100vh;background:#FFD23F}</style>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="pv-template">
<div class="pv-fade" style="background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; min-height: 100vh">
<sc-if value="{{gateOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-labelledby="pv-age-h" class="pv-fade" style="position: fixed; inset: 0; z-index: 200; background: {{t.bg}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; overflow: auto">
<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<span style="display: flex; align-items: center; gap: 10px"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="0" y="0" width="8" height="8" fill="{{t.ink}}"></rect><rect x="16" y="0" width="8" height="8" fill="{{t.ink}}"></rect><rect x="8" y="8" width="8" height="8" fill="{{t.ink}}"></rect><rect x="0" y="16" width="8" height="8" fill="{{t.ink}}"></rect><rect x="16" y="16" width="8" height="8" fill="{{t.ink}}"></rect></svg><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.04em">PIVOLINA</span></span>
<sc-if value="{{gateAsk}}" hint-placeholder-val="{{ true }}">
<h1 id="pv-age-h" class="pv-age-h" style="margin: 0; font-family: Oi, sans-serif; font-weight: 400; font-size: 64px; line-height: 1.05">Imaš li 18 godina?</h1>
<p style="margin: 0; max-width: 480px; font-size: 19px; line-height: 1.5">Pivolinu prodajemo samo punoljetnim osobama. Potvrdi da imaš 18 ili više godina i uđi.</p>
<div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center">
<button type="button" onClick="{{ageYes}}" style="cursor: pointer; font-family: Inter, sans-serif; font-weight: 700; font-size: 19px; padding: 17px 32px; border-radius: 999px; border: 0; background: {{t.ink}}; color: {{t.bg}}; box-shadow: 5px 5px 0 #141414">Da, imam 18+</button>
<button type="button" onClick="{{ageNo}}" style="cursor: pointer; font-family: Inter, sans-serif; font-weight: 700; font-size: 19px; padding: 14px 30px; border-radius: 999px; border: 3px solid {{t.ink}}; background: transparent; color: {{t.ink}}">Ne, nemam</button>
</div>
<p style="margin: 0; font-size: 14px; font-weight: 700">Pij odgovorno.</p>
</sc-if>
<sc-if value="{{gateNo}}" hint-placeholder-val="{{ false }}">
<h1 id="pv-age-h" class="pv-age-h" style="margin: 0; font-family: Oi, sans-serif; font-weight: 400; font-size: 56px; line-height: 1.05">Vidimo se za koju godinu!</h1>
<p style="margin: 0; max-width: 480px; font-size: 19px; line-height: 1.5">Pivolina je samo za punoljetne osobe.</p>
<button type="button" onClick="{{ageBack}}" style="cursor: pointer; font-family: Inter, sans-serif; font-weight: 700; font-size: 16px; padding: 12px 24px; border-radius: 999px; border: 3px solid {{t.ink}}; background: transparent; color: {{t.ink}}">Natrag</button>
</sc-if>
</div>
</div>
</sc-if>

<header class="pv-fade" style="position: sticky; top: 0; z-index: 50; background: {{t.bg}}; border-bottom: 3px solid {{t.ink}}">
<div class="pv-hd" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 14px 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<a href="#vrh" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="0" y="0" width="8" height="8" fill="{{t.ink}}"></rect><rect x="16" y="0" width="8" height="8" fill="{{t.ink}}"></rect><rect x="8" y="8" width="8" height="8" fill="{{t.ink}}"></rect><rect x="0" y="16" width="8" height="8" fill="{{t.ink}}"></rect><rect x="16" y="16" width="8" height="8" fill="{{t.ink}}"></rect></svg>
<span class="pv-logo-word" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.04em">PIVOLINA</span>
</a>
<nav class="pv-nav" aria-label="Glavna navigacija" style="display: flex; gap: 104px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; flex-wrap: wrap">
<a href="#piva" style="text-decoration: none; padding: 10px 0">Upoznaj Pivolinu</a>
<a href="#prica" style="text-decoration: none; padding: 10px 0">Iz srca Zagreba</a>
<a href="#lokalno" style="text-decoration: none; padding: 10px 0">Gdje kupiti</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<a href="#kosarica" class="pv-fade pv-cart" aria-label="{{cartLabel}}" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border: 3px solid {{t.ink}}; border-radius: 999px; box-sizing: border-box; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.6 12.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"></path></svg><sc-if value="{{cartHas}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #141414; color: #FFF8EC; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if></a>
<a href="#naruci" class="pv-fade pv-kupi" style="display: inline-flex; align-items: center; white-space: nowrap; background: {{t.ink}}; color: {{t.bg}}; text-decoration: none; font-weight: 700; font-size: 16px; padding: 14px 26px; border-radius: 999px; box-shadow: 4px 4px 0 #141414">
Kupi<span class="pv-hide-sm">&#160;Pivolinu</span>
</a>
<button class="pv-burger pv-fade" onClick="{{toggleMenu}}" aria-label="Izbornik" aria-expanded="{{menuExpanded}}" style="cursor: pointer; width: 46px; height: 46px; align-items: center; justify-content: center; border: 3px solid {{t.ink}}; border-radius: 999px; background: transparent; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<nav class="pv-mnav pv-fade" aria-label="Mobilna navigacija" style="flex-direction: column; padding: 8px 16px 20px; gap: 4px; border-top: 2px solid {{t.ink}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">
<a href="#piva" onClick="{{closeMenu}}" style="text-decoration: none; padding: 12px 0">Upoznaj Pivolinu</a>
<a href="#prica" onClick="{{closeMenu}}" style="text-decoration: none; padding: 12px 0">Iz srca Zagreba</a>
<a href="#lokalno" onClick="{{closeMenu}}" style="text-decoration: none; padding: 12px 0">Gdje kupiti</a>
</nav>
</sc-if>
</header>

<section id="vrh">
<div class="pv-wrap pv-hero" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 48px 48px 40px; display: flex; flex-direction: column; gap: 36px">
<svg class="pv-hero-svg" width="100%" height="340" viewBox="0 -80 963 84" preserveAspectRatio="none" style="display: block; overflow: visible" role="img" aria-label="Tvoj potez."><text x="0" y="0" font-family="Oi, sans-serif" font-size="100" fill="{{t.ink}}">TVOJ POTEZ.</text></svg>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap">
</div>
</div>
</section>

<section id="piva" style="position: relative; height: 2700px">
<div id="pv-spin" style="position: absolute; inset: 0" aria-hidden="true"></div>
<div class="pv-sticky" style="position: sticky; top: 76px; height: 820px; overflow: hidden">
<div class="pv-spin-grid" style="max-width: 1440px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: 40px 48px 196px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 110px">
<div class="pv-copy" style="align-self: start; min-width: 0; max-width: 560px; display: flex; flex-direction: column; gap: 26px; position: relative; z-index: 3">
<h2 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">{{t.title}}</h2>
<p class="pv-taste" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.05; letter-spacing: -0.01em">{{t.taste}}</p>
<dl class="pv-dl" style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; font-size: 20px; line-height: 1.4">
<dt style="font-weight: 700">Sastojci</dt><dd style="margin: 0">{{t.ingr}}</dd>
<dt style="font-weight: 700">Jačina</dt><dd style="margin: 0">[X,X % vol.] · 0,33 l</dd>
<dt style="font-weight: 700">Uz što</dt><dd style="margin: 0">{{t.pair}}</dd>
</dl>
<a href="#naruci" class="pv-fade pv-cta" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; background: {{t.ink}}; color: {{t.bg}}; text-decoration: none; font-weight: 700; font-size: 19px; padding: 17px 30px; border-radius: 999px; box-shadow: 5px 5px 0 #141414"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.5 12h-11z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>Naruči u internetskoj trgovini</a>
</div>
<div class="pv-can-col" style="position: relative; min-width: 0">
<div class="pv-fade pv-can-ring" style="position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; transform: translate(-50%, -50%); border-radius: 50%; background: {{t.accent}}; opacity: 0.55" aria-hidden="true"></div>
<div class="pv-can" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg) scale(0.82); filter: drop-shadow(18px 26px 22px rgba(0,0,0,0.35)); display: flex; flex-direction: column; align-items: center">
<div style="width: 220px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at 45% 40%, #FBF0C4 0%, #D8B45A 45%, #8C6A23 100%); margin-bottom: -12px; position: relative; z-index: 2"></div>
<div style="width: 250px; height: 28px; border-radius: 50% 50% 4px 4px / 100% 100% 4px 4px; background: linear-gradient(90deg, #6B5220 0%, #C9A043 18%, #F7E7A8 30%, #D9B65A 50%, #A98431 72%, #5E4718 100%)"></div>
<div style="position: relative; width: 260px; height: 583px; overflow: hidden; border-radius: 3px 3px 10px 10px; background: #141414">
<sc-for list="{{slices}}" as="s" hint-placeholder-count="36">
<div class="pv-strip" style="position: absolute; top: 0; left: {{s.x}}px; width: {{s.w}}px; height: 583px; background-size: {{s.size}}px 583px; background-position: {{s.pos}}px 0"></div>
</sc-for>
<div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.14) 10%, rgba(255,255,255,0) 20%, rgba(255,255,255,0.34) 29%, rgba(255,255,255,0.06) 36%, rgba(255,255,255,0) 48%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.22) 82%, rgba(0,0,0,0.6) 100%)"></div>
</div>
<div style="width: 250px; height: 24px; border-radius: 4px 4px 50% 50% / 4px 4px 100% 100%; background: linear-gradient(90deg, #4E3A14 0%, #B48E3C 22%, #EAD493 32%, #A9873A 55%, #47350F 100%)"></div>
</div>
</div>
</div>
<p class="pv-tagline" style="position: absolute; left: 48px; right: 48px; bottom: 16px; margin: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.2">Zagrebačko craft pivo. Tri piva, jedan potez.</p>
<div class="pv-fade pv-marq-wrap" style="position: absolute; left: 0; right: 0; bottom: 104px; height: 76px; overflow: hidden; display: flex; align-items: center">
<ul class="pv-marq" aria-label="Atributi Pivoline" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 36px; width: max-content; flex-shrink: 0">
<sc-for list="{{marquee}}" as="m" hint-placeholder-count="20">
<li class="pv-fade" style="display: flex; align-items: center; white-space: nowrap; background: {{t.ink}}; color: {{t.bg}}; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 17px">{{m}}</li>
</sc-for>
</ul>
</div>
</div>
</section>

<section id="prica">
<div class="pv-wrap pv-sec" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 96px 48px 72px; display: flex; flex-direction: column; gap: 64px">
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<svg class="pv-h-svg" width="100%" height="120" viewBox="0 -80 586 84" preserveAspectRatio="none" style="display: block; overflow: visible" role="img" aria-label="Iz srca"><text x="0" y="0" font-family="Oi, sans-serif" font-size="100" fill="{{t.ink}}">IZ SRCA</text></svg>
<svg class="pv-h-svg" width="100%" height="120" viewBox="0 -80 775 84" preserveAspectRatio="none" style="display: block; overflow: visible" role="img" aria-label="Zagreba"><text x="0" y="0" font-family="Oi, sans-serif" font-size="100" fill="{{t.ink}}">ZAGREBA.</text></svg>
</div>
<div class="pv-story" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; font-size: 20px; line-height: 1.55">
<p class="pv-story-lead" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2">Priča je zapravo skroz jednostavna.</p>
<p style="margin: 0">Volimo craft pivo, ali nam je dosadilo to što za većinu piva s police moraš guglati što uopće piješ. Zato smo odlučili napraviti Pivolinu, tri okusa, bez kompliciranja, u limenci koju prepoznaješ iz aviona.</p>
<p style="margin: 0">Kuhamo je u Zagrebu, polako i u malim serijama, držeći se domaćih sastojaka. Pivolina je stvorena za stvarne trenutke: cuganje na terasi nakon posla, roštiljanje s društvom ili opuštanje doma uz dobar film.</p>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.25">Učini pravi potez. Odaberi okus koji ti leži i uživaj.</p>
</div>
</div>
<div class="pv-trio" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 72px">
<sc-for list="{{trio}}" as="b" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 16px; padding: 8px 4px">
<div style="display: flex; justify-content: center; position: relative; padding: 8px 0 44px">
<div style="position: absolute; top: 50%; left: 50%; width: 230px; height: 310px; transform: translate(-50%, -50%); border-radius: 50%; background: {{b.accent}}" aria-hidden="true"></div>
<img src="{{b.can}}" alt="{{b.alt}}" style="position: relative; height: 340px; transform: rotate({{b.rot}}deg); filter: drop-shadow(10px 16px 14px rgba(0,0,0,0.3))">
</div>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.1; letter-spacing: -0.01em">{{b.name}}</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.5">{{b.desc}}</p>
<button onClick="{{b.add}}" style="cursor: pointer; margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: #FFFFFF; color: {{b.prim}}; border: 0; font-family: Inter, sans-serif; font-weight: 700; font-size: 16px; padding: 13px 22px; border-radius: 999px; box-shadow: 4px 4px 0 #141414"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{b.prim}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.6 12.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"></path></svg>Dodaj u košaricu</button>
</article>
</sc-for>
</div>
</div>
</section>

<section id="ljubitelji">
<div class="pv-wrap pv-sec" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 72px 48px 48px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 700; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase">Ljubitelji Pivoline</span>
